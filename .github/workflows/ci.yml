# Continuous integration for SunPower OS.
#
# Every push to main and every pull request runs lint, type-check, unit tests
# and a production build. Deployment is handled by Vercel's GitHub integration
# (main -> production, pull requests -> preview URLs), so this workflow is the
# quality gate in front of it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build never connects to MongoDB: with Cache Components every DB read
      # happens at request time, so placeholders are enough here.
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      AUTH_SECRET: ci-only-secret-never-used-in-any-environment-0123456789
      NEXT_TELEMETRY_DISABLED: 1
      # Skip the MongoDB binary download for in-memory tests until they need it.
      MONGOMS_DISABLE_POSTINSTALL: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
